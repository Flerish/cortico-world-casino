<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>月下牌桌 · 抽鬼牌对局预览(临时)</title>
<style>
  body { background: #101418; padding: 24px; font-family: system-ui, sans-serif; }
  #panel { max-width: 560px; margin: 0 auto; }
</style>
</head>
<body>
<div id="panel"></div>
<script type="module">
  const root = document.getElementById('panel');
  const snapshot = {
    version: 11, game: 'oldmaid', phase: 'idle', blackjack: null, oldmaid: null,
    ai: { chips: 1000, wins: 0, losses: 0, pushes: 0, net: 0, bankruptcies: 0 },
    player: { chips: 1000, wins: 0, losses: 0, pushes: 0, net: 0, bankruptcies: 0 },
    minBet: 10, maxBet: 200, startChips: 1000, dealerHitsSoft17: false, matches: [],
    turnOwner: 'player', winner: null,
    playerCards: ['♥2', '♥4', '♣7', '♦K'], playerHandCount: 4, aiHandCount: 5,
    discardPairs: 3, lastDiscards: [['♠9', '♦9'], ['♣A', '♦A'], ['♠5', '♥5']],
    score: { ai: 0, player: 0 },
    oldmaidHistory: [],
  };
  const ctx = {
    root,
    signal: new AbortController().signal,
    language: 'zh',
    pageId: 'world:casino',
    panelId: 'table',
    async invoke(method) {
      if (method === 'state') return snapshot;
      throw new Error('stub');
    },
    stream(handlers) {
      window.__push = () => handlers.message(JSON.stringify(snapshot));
      return { dispose() {} };
    },
  };
  const mod = await import('./webui.js');
  await mod.default.panels.table.mount(ctx);
  window.__panelReady = true;
</script>
</body>
</html>
