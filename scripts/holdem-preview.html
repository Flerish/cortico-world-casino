<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>月下牌桌 · 德州扑克对局预览(临时)</title>
<style>
  body { background: #101418; padding: 24px; font-family: system-ui, sans-serif; }
  #panel { max-width: 560px; margin: 0 auto; }
</style>
</head>
<body>
<div id="panel"></div>
<script type="module">
  const root = document.getElementById('panel');
  // 玩家行动中的场景:公共牌 4 张(转牌街),轮到玩家,要跟 40,可加注到 80。
  const snapshot = {
    version: 23, game: 'holdem', phase: 'turn', round: 4, button: 'player', toAct: 'player',
    winner: null, revealHole: false, byFold: false,
    ai: { chips: 940, wins: 1, losses: 2, pushes: 0, net: -60, bankruptcies: 0 },
    player: { chips: 1030, wins: 2, losses: 1, pushes: 0, net: 30, bankruptcies: 0 },
    minBet: 10, maxBet: 200, startChips: 1000, dealerHitsSoft17: false, matches: [],
    blinds: { sb: 5, bb: 10 }, streetCap: 200,
    currentBet: 60, minRaise: 20, pot: 140,
    community: ['♠2', '♠3', '♠4', '♠9'],
    playerCards: ['♠A', '♠K'], aiCards: null, aiHoleCount: 2,
    aiCommitted: 70, playerCommitted: 70,
    aiFolded: false, playerFolded: false, aiAllIn: false, playerAllIn: false,
    lastHoldem: null,
    holdemHistory: [
      { at: '2026-11-24T10:40:00+08:00', round: 3, winner: 'player', by: 'showdown', pot: 60, delta: -30, board: ['♥2', '♦7', '♣9', '♠J', '♥K'], playerHole: ['♦A', '♦10'], aiHole: ['♣7', '♥7'], aiMade: '两对 7 和 9', playerMade: '一对 A' },
      { at: '2026-11-24T10:32:00+08:00', round: 2, winner: 'ai', by: 'fold', pot: 25, delta: 15, board: ['♦5', '♣10', '♥Q'], playerHole: ['♠8', '♥8'], aiHole: [], },
    ],
  };
  const ctx = {
    root,
    signal: new AbortController().signal,
    language: 'zh',
    pageId: 'world:casino',
    panelId: 'table',
    async invoke(method) {
      if (method === 'state') return snapshot;
      throw new Error('stub');
    },
    stream(handlers) {
      window.__push = () => handlers.message(JSON.stringify(snapshot));
      return { dispose() {} };
    },
  };
  const mod = await import('./webui.js');
  await mod.default.panels.table.mount(ctx);
  window.__panelReady = true;
</script>
</body>
</html>
